services:
  postgres:
    image: paradedb/paradedb:latest-pg16
    environment:
      POSTGRES_DB: lobe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lobepwd
    ports:
      - '5433:5432'
    volumes:
      - ./.local/pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./.local/minio:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/lobe || true;
      mc anonymous set download local/lobe;
      "

  lobehub:
    image: lobehub:local
    ports:
      - '3210:3210'
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
